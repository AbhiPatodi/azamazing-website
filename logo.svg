    <path d="M12 0 L24 16 L17 16 L17 28 L7 28 L7 16 L0 16 Z" fill="#E8562A"/>
  </g>

  <!-- "azamazing" bold wordmark -->
  <text x="8" y="44" font-family="'Nunito', 'Inter', 'Arial Rounded MT Bold', Arial, sans-serif" font-weight="800" font-size="36" letter-spacing="-1" fill="#FFFFFF">azamazing</text>

  <!-- registered mark -->
  <text x="244" y="28" font-family="Arial, sans-serif" font-weight="400" font-size="14" fill="#FFFFFF">®</text>

  <!-- "group" subtitle, lighter weight -->
